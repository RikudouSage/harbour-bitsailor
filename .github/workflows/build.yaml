name: Build RPMs

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  OS_VERSION: 5.1.0.11

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build App
    strategy:
      matrix:
        arch: [ 'armv7hl', 'aarch64', 'i486' ]

    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        name: Install Nix
      - name: Build core
        working-directory: core
        run: nix develop --command make build-lib-${{ matrix.arch }}
      - name: Prepare
        run: docker pull coderus/sailfishos-platform-sdk:$OS_VERSION && mkdir -p output && chmod 777 output

      - name: Build ${{ matrix.arch }}
        run: docker run --rm --privileged -v $PWD:/share coderus/sailfishos-platform-sdk:$OS_VERSION /bin/bash -c "
          mkdir -p build ;
          cd build ;
          cp -r /share/* . ;
          mb2 -t SailfishOS-$OS_VERSION-${{ matrix.arch }} build ;
          cp -r RPMS/*.rpm /share/output"

      - name: Upload RPM (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.arch }}
          path: output
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download armv7hl
        uses: actions/download-artifact@v8
        with:
          name: rpm-armv7hl
        continue-on-error: true
      - name: Download aarch64
        uses: actions/download-artifact@v8
        with:
          name: rpm-aarch64
        continue-on-error: true
      - name: Download i486
        uses: actions/download-artifact@v8
        with:
          name: rpm-i486
        continue-on-error: true
      - name: Extract Version Name
        id: extract_name
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            return context.payload.ref.replace(/refs\/tags\//, '');
      - name: Create a Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.extract_name.outputs.result }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: '*.rpm'
