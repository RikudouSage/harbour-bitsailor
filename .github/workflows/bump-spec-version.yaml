name: Bump spec version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to set in rpm/harbour-bitsailor.spec
        required: true
        type: string
      create_tag:
        description: Create and push the v<version> tag after updating the spec
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: bump-spec-version-master
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Update spec version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}([._+-][0-9A-Za-z._+-]+)?$ ]]; then
            echo "Version must use a numeric dot-separated format (for example, 1.10.0)." >&2
            exit 1
          fi

          sed -i -E "s/^Version:[[:space:]]*.*/Version:    $VERSION/" rpm/harbour-bitsailor.spec

      - name: Commit and push version bump
        uses: actions-x/commit@v6
        with:
          branch: master
          files: rpm/harbour-bitsailor.spec
          message: 'Bump spec version to ${{ inputs.version }}'

      - name: Create and push version tag
        if: inputs.create_tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "v$VERSION" --message "Release v$VERSION"
          git push origin "v$VERSION"
          gh workflow run build.yaml --ref "v$VERSION"
