name: Bump spec version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to set in rpm/harbour-bitsailor.spec
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-spec-version-master
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Update spec version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}([._+-][0-9A-Za-z._+-]+)?$ ]]; then
            echo "Version must use a numeric dot-separated format (for example, 1.10.0)." >&2
            exit 1
          fi

          sed -i -E "s/^Version:[[:space:]]*.*/Version:    $VERSION/" rpm/harbour-bitsailor.spec

      - name: Create version-bump pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/bump-spec-version-$VERSION"

          if existing_pr="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')" && [ -n "$existing_pr" ]; then
            echo "Version-bump pull request already exists: $existing_pr"
            exit 0
          fi

          git switch --create "$branch"
          git add rpm/harbour-bitsailor.spec
          if git diff --cached --quiet; then
            echo "rpm/harbour-bitsailor.spec is already version $VERSION; no pull request created."
            exit 0
          fi

          git commit --message "Bump spec version to $VERSION"
          git push origin "HEAD:$branch"
          gh pr create \
            --base master \
            --head "$branch" \
            --title "Bump spec version to $VERSION" \
            --body "Automated version bump for the release workflow."
